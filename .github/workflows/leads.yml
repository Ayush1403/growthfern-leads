name: leads
on:
  schedule: [{cron: "*/5 * * * *"}]  # GitHub's minimum; runs can start a few minutes late
  workflow_dispatch:
concurrency: leads
permissions: {contents: write}
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -r requirements.txt
      - run: python leads.py
        env:
          RUN_ONCE: "1"
          DRY_RUN: "0"
          DB_PATH: state/leads.db
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
      # Save which posts were seen. The commit also counts as repo activity, so GitHub
      # doesn't pause the schedule after 60 quiet days.
      - run: |
          git config user.name leads-bot && git config user.email leads-bot@users.noreply.github.com
          git add state/leads.db && git commit -qm "seen posts" && git push -q || true
